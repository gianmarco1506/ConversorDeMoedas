<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    <title>Convert Money</title>
</head>

<body>
    <img src="assets/logo.gif" alt="logo-convertmoney" class="logo">

    <main>
        <label>
            converter <b>de</b>
            <select class="converter-de" id="converter-de">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar Americano</option>
                <option value="bitcoin">₿ Bitcoin</option>
        </select>
        </label>

        <label>
            converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">US$ Dólar americano</option>
                    <option value="euro">€ Euro</option>
        </select>
        </label>

        <label>
            valor
            <input oninput="formatarMoeda(this)" type="text" class="input-currency" id="input-money" placeholder="R$ 10.000,00">
        </label>

        <button class="convert-button">Converter</button>
       
    <section>
       <div class="currency-box">
         <img src="assets/brasil 2.png" alt="moeda-a-converter" class="currency-from-img">
         <p class="currency currency-from-name">Real</p>
         <p class="currency-value-to-convert">R$ 0,00</p>
       </div>

      <img src="assets/seta.png" alt="" class="arrow-img">

       <div class="currency-box">
         <img src="assets/dolar.png" alt="moeda-convertida" class="currency-img">
         <p class="currency" id="currency-name">Dólar americano</p>
         <p class="currency-value">US$ 0,00</p>
       </div>
       
     </section>

    </main>
</body>
        <script src="https://cloudflare.com"></script>
        <script src="scripts.js"></script>
</html>
